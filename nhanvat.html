<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Nhân Vật - Tu Tiên</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/character.css">
    <link rel="stylesheet" href="css/information.css">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-button">Trang chủ</a>
        </div>
        <h1>Thông Tin Nhân Vật</h1>
        
        <div class="character-avatar">
            <div class="avatar-container">
                <img src="images/avatar.png" alt="Nhân vật" class="avatar-image"
                      onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';">
                <div id="avatar-fallback" class="avatar-image" style="display:none; align-items:center; justify-content:center; font-size:2rem; color:#4ecdc4;">⚔️</div>
            </div>
        </div>

        <div class="character-info">
            <div class="character-name" id="character-name">Linh Tu</div>
            <div class="character-level" id="character-level">Luyện Khí Kỳ Tầng 1</div>
            <div class="exp-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="exp-progress"></div>
                </div>
                <div class="exp-text" id="character-exp">Kinh nghiệm: 0/100</div>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-section="equipment">Trang bị</button>
                <button class="tab-button" data-section="stats">Chỉ số</button>
            </div>

            <div id="equipment-section" class="section active">
                <h3>Trang Bị Hiện Tại</h3>
                <div id="equipment-grid" class="equipment-grid">
                    <!-- Equipment items will be generated by JavaScript -->
                </div>
            </div>

            <div id="stats-section" class="section">
                <h3>Chỉ Số Nhân Vật</h3>
                <div class="potential-points" id="potential-points">⭐ Điểm Tiềm Năng: 0</div>
                <div class="stats-grid" id="stats-grid"></div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="index.html" class="action-btn btn-secondary">Quay lại</a>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="inventory-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Chọn trang bị</h2>
            <div class="modal-grid" id="modal-grid"></div>
        </div>
    </div>

    <div class="modal" id="item-details-modal">
        <div class="modal-content">
            <div id="item-details-content"></div>
        </div>
    </div>

    <script>
        // Global function definitions that are available immediately
        function showSection(sectionId) {
            console.log('Chuyển sang section:', sectionId);
            
            // Hide all sections
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => section.classList.remove('active'));
            
            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => button.classList.remove('active'));
            
            // Show selected section
            const selectedSection = document.getElementById(sectionId + '-section');
            if (selectedSection) {
                selectedSection.classList.add('active');
                console.log(`Đã kích hoạt section: ${sectionId}`);
            } else {
                console.error(`Không tìm thấy section: ${sectionId}-section`);
            }
            
            // Add active class to selected tab button
            const selectedButton = document.querySelector(`.tab-button[data-section="${sectionId}"]`);
            if (selectedButton) {
                selectedButton.classList.add('active');
                console.log(`Đã kích hoạt tab button: ${sectionId}`);
            } else {
                console.error(`Không tìm thấy tab button với data-section: ${sectionId}`);
            }
            
            // Update displays based on section
            if (sectionId === 'stats' && window.updateStatsDisplay) {
                window.updateStatsDisplay();
            } else if (sectionId === 'equipment' && window.updateEquipmentDisplay) {
                window.updateEquipmentDisplay();
            }
        }

        function closeModal() {
            const modal = document.getElementById('inventory-modal');
            if (modal) modal.style.display = 'none';
        }

        // Set up event listeners when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Set up tab button event listeners
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const sectionId = this.getAttribute('data-section');
                    showSection(sectionId);
                });
            });

            // Wait for game.js to load, then initialize
            const initializeWhenReady = () => {
                if (window.initializeGameState && window.updateDisplay && window.updateEquipmentDisplay) {
                    console.log('Game functions loaded, initializing...');
                    window.initializeGameState();
                    
                    const gameState = window.gameState || window.initializeGameState();
                    
                    // Update character display elements
                    const levelDisplay = document.getElementById('character-level');
                    if (levelDisplay) {
                        levelDisplay.textContent = `${gameState.levelTier} ${gameState.levelSubTier} (Cấp ${gameState.level})`;
                    }
                    
                    const expDisplay = document.getElementById('character-exp');
                    if (expDisplay) {
                        expDisplay.textContent = `Kinh nghiệm: ${gameState.exp}/${gameState.maxExp}`;
                    }
                    
                    const expProgress = document.getElementById('exp-progress');
                    if (expProgress) {
                        const percentage = (gameState.exp / gameState.maxExp) * 100;
                        expProgress.style.width = `${percentage}%`;
                    }
                    
                    window.updateDisplay();
                    window.updateEquipmentDisplay();
                } else {
                    console.log('Waiting for game functions to load...');
                    setTimeout(initializeWhenReady, 100);
                }
            };

            initializeWhenReady();
        });
    </script>
    
    <!-- Load common.js and game.js after the page structure is ready -->
    <script src="js/common.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
